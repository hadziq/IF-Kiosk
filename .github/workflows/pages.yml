# Validates data/*.csv, runs the tests and builds the kiosk on every push and
# pull request. Pushes to master are then published to GitHub Pages at
# https://<owner>.github.io/<repo>/.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# The kiosk pairs with phones through the relay in relay/, deployed by
# relay.yml. The repository variable RELAY_URL overrides its address
# (Settings → Secrets and variables → Actions → Variables); set it to "none"
# to turn phone pairing off.

name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RELAY_URL: ${{ vars.RELAY_URL || 'wss://if-kiosk-relay.labgigaits.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
